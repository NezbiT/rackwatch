# Grafana instance used as an embed inside RackWatch.
# Anonymous Viewer + allow_embedding lets the iframe load without a
# second login on a trusted LAN. Change this before you expose port 3001.

[server]
protocol = http
http_port = 3000

[security]
allow_embedding = true
cookie_samesite = disabled
admin_user = admin

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[auth.basic]
enabled = true

[users]
allow_sign_up = false
default_theme = dark

[alerting]
enabled = false

[unified_alerting]
enabled = true

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/rackwatch-overview.json
