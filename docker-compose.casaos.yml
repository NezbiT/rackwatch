# CasaOS / Proxmox overlay.
# CasaOS already uses :8080 (UI) and :3001 (Uptime Kuma). This remaps RackWatch.
#
#   docker compose -f docker-compose.yml -f docker-compose.casaos.yml up -d --build
#
# Then open http://<casaos-ip>:8180
# Set RACKWATCH_PUBLIC_URL and GRAFANA_PUBLIC_URL in .env to that IP.

name: rackwatch

services:
  rackwatch:
    ports: !override
      - "8180:8080"
    environment:
      RACKWATCH_PUBLIC_URL: ${RACKWATCH_PUBLIC_URL:-http://10.13.58.100:8180}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://10.13.58.100:3002}

  grafana:
    ports: !override
      - "3002:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://10.13.58.100:3002}

  cadvisor:
    ports: !override
      - "8082:8080"
