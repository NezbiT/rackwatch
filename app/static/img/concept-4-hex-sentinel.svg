<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040714"/>
    </linearGradient>

    <linearGradient id="hexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="hexInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="meterCpu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="meterRam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="90%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="meterAlert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad4)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" stroke="#1e293b" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Outer Glowing Hexagon -->
  <polygon points="128,26 214,75 214,181 128,230 42,181 42,75" 
           fill="#070c1a" stroke="url(#hexBorder)" stroke-width="3" stroke-linejoin="round"
           filter="url(#glow4)"/>
  <polygon points="128,26 214,75 214,181 128,230 42,181 42,75" 
           fill="#070c1a" stroke="url(#hexBorder)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hex Inner Wireframe Accent -->
  <polygon points="128,40 200,81 200,175 128,216 56,175 56,81" 
           stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3"/>

  <!-- Floating Server Blade 1 (CPU & Compute) -->
  <g>
    <rect x="68" y="66" width="120" height="28" rx="6" fill="url(#hexInner)" stroke="#334155" stroke-width="1.2"/>
    <!-- LED -->
    <circle cx="80" cy="80" r="3" fill="#10b981"/>
    <!-- Label representation / mini icon -->
    <rect x="90" y="76" width="10" height="8" rx="1.5" fill="#475569"/>
    <!-- Metric Gauge Bar -->
    <rect x="106" y="77" width="58" height="6" rx="3" fill="#090d16"/>
    <rect x="106" y="77" width="42" height="6" rx="3" fill="url(#meterCpu)"/>
    <!-- Percent indicator dots -->
    <circle cx="174" cy="80" r="1.5" fill="#10b981"/>
    <circle cx="178" cy="80" r="1.5" fill="#10b981"/>
  </g>

  <!-- Floating Server Blade 2 (RAM & Telemetry) -->
  <g>
    <rect x="68" y="104" width="120" height="28" rx="6" fill="url(#hexInner)" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.7"/>
    <!-- LED -->
    <circle cx="80" cy="118" r="3" fill="#06b6d4"/>
    <!-- Mini Memory Chip Icon -->
    <rect x="90" y="114" width="10" height="8" rx="1.5" fill="#0284c7"/>
    <!-- Metric Gauge Bar -->
    <rect x="106" y="115" width="58" height="6" rx="3" fill="#090d16"/>
    <rect x="106" y="115" width="34" height="6" rx="3" fill="url(#meterRam)"/>
    <!-- Heartbeat Spark Line -->
    <path d="M 170 118 L 173 118 L 175 113 L 177 123 L 179 118 L 182 118" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Floating Server Blade 3 (Storage & Alerts) -->
  <g>
    <rect x="68" y="142" width="120" height="28" rx="6" fill="url(#hexInner)" stroke="#334155" stroke-width="1.2"/>
    <!-- LED -->
    <circle cx="80" cy="156" r="3" fill="#f59e0b"/>
    <!-- Mini Disk Icon -->
    <circle cx="95" cy="156" r="4.5" fill="#475569"/>
    <!-- Metric Gauge Bar -->
    <rect x="106" y="153" width="58" height="6" rx="3" fill="#090d16"/>
    <rect x="106" y="153" width="48" height="6" rx="3" fill="url(#meterAlert)"/>
    <!-- Warning Beacon dot -->
    <circle cx="176" cy="156" r="2" fill="#ef4444"/>
  </g>

  <!-- Bottom Terminal / Core Indicator -->
  <circle cx="128" cy="192" r="5" fill="#06b6d4" filter="url(#glow4)"/>
  <circle cx="128" cy="192" r="2" fill="#ffffff"/>
</svg>
