<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="borderGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad2)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" stroke="url(#borderGlow2)" stroke-width="2.5" stroke-opacity="0.75"/>

  <!-- Rack Mount Corner Brackets -->
  <path d="M 36 60 L 36 36 L 60 36" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 220 60 L 220 36 L 196 36" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 36 196 L 36 220 L 60 220" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 220 196 L 220 220 L 196 220" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Hex Bolts on Corners -->
  <circle cx="48" cy="48" r="3" fill="#64748b"/>
  <circle cx="208" cy="48" r="3" fill="#64748b"/>
  <circle cx="48" cy="208" r="3" fill="#64748b"/>
  <circle cx="208" cy="208" r="3" fill="#64748b"/>

  <!-- Outer Lens Ring (Chassis Bezel) -->
  <circle cx="128" cy="128" r="82" fill="#070d19" stroke="#1e293b" stroke-width="2"/>
  <circle cx="128" cy="128" r="82" fill="url(#radarSweep)"/>

  <!-- Radar Concentric Rings -->
  <circle cx="128" cy="128" r="66" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <circle cx="128" cy="128" r="46" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="128" cy="128" r="26" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="128" cy="128" r="8" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Crosshairs / Ticks -->
  <line x1="128" y1="42" x2="128" y2="214" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="42" y1="128" x2="214" y2="128" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Degree Tick Marks -->
  <line x1="128" y1="42" x2="128" y2="48" stroke="#06b6d4" stroke-width="2"/>
  <line x1="128" y1="208" x2="128" y2="214" stroke="#06b6d4" stroke-width="2"/>
  <line x1="42" y1="128" x2="48" y2="128" stroke="#06b6d4" stroke-width="2"/>
  <line x1="208" y1="128" x2="214" y2="128" stroke="#06b6d4" stroke-width="2"/>

  <!-- Sweeping Radar Sector Cone -->
  <path d="M 128 128 L 186 70 A 82 82 0 0 1 210 128 Z" fill="url(#sweepCone)"/>
  <line x1="128" y1="128" x2="186" y2="70" stroke="#38bdf8" stroke-width="2" filter="url(#glow2)"/>

  <!-- Monitored Host/Container Blips (Targets) -->
  <!-- Blip 1: Healthy container (green) -->
  <circle cx="168" cy="98" r="4.5" fill="#10b981" filter="url(#glow2)"/>
  <circle cx="168" cy="98" r="8" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="168" cy="98" r="2" fill="#ffffff"/>

  <!-- Blip 2: Active container (cyan) -->
  <circle cx="94" cy="154" r="3.5" fill="#06b6d4" filter="url(#glow2)"/>
  <circle cx="94" cy="154" r="1.5" fill="#ffffff"/>

  <!-- Blip 3: Warning container (amber/orange) -->
  <circle cx="102" cy="88" r="4" fill="#f59e0b" filter="url(#glow2)"/>
  <circle cx="102" cy="88" r="7" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="102" cy="88" r="1.5" fill="#ffffff"/>

  <!-- Center Sentinel Pupil -->
  <circle cx="128" cy="128" r="3.5" fill="#ffffff" filter="url(#glow2)"/>
</svg>
