<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#03060f"/>
    </linearGradient>
    <linearGradient id="favHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base -->
  <rect width="32" height="32" rx="7" fill="url(#favBg)"/>

  <!-- Outer Hexagon Frame -->
  <polygon points="16,3.5 27,9.5 27,22.5 16,28.5 5,22.5 5,9.5" 
           fill="#070c1a" stroke="url(#favHex)" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Server Blade 1 (CPU - Green) -->
  <rect x="8" y="8" width="16" height="3.6" rx="1.2" fill="#0f172a" stroke="#334155" stroke-width="0.6"/>
  <circle cx="10.2" cy="9.8" r="1" fill="#10b981"/>
  <rect x="12.8" y="9" width="8" height="1.6" rx="0.8" fill="#10b981"/>

  <!-- Server Blade 2 (RAM / Telemetry - Cyan) -->
  <rect x="8" y="13.2" width="16" height="3.6" rx="1.2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.7"/>
  <circle cx="10.2" cy="15" r="1" fill="#06b6d4"/>
  <rect x="12.8" y="14.2" width="6" height="1.6" rx="0.8" fill="#38bdf8"/>
  <circle cx="21.5" cy="15" r="0.8" fill="#38bdf8"/>

  <!-- Server Blade 3 (Storage / Alert - Amber/Red) -->
  <rect x="8" y="18.4" width="16" height="3.6" rx="1.2" fill="#0f172a" stroke="#334155" stroke-width="0.6"/>
  <circle cx="10.2" cy="20.2" r="1" fill="#f59e0b"/>
  <rect x="12.8" y="19.4" width="7" height="1.6" rx="0.8" fill="#f59e0b"/>
  <circle cx="21.5" cy="20.2" r="0.9" fill="#ef4444"/>

  <!-- Bottom Core Beacon -->
  <circle cx="16" cy="24.8" r="1.1" fill="#06b6d4"/>
</svg>
