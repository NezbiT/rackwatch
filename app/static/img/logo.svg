<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none" role="img" aria-label="RackWatch">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rwBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="45%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#03060f"/>
    </linearGradient>

    <!-- App Squircle Border -->
    <linearGradient id="rwSquircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Hexagon Outer Border Gradient -->
    <linearGradient id="rwHexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Blade Container Surface Gradient -->
    <linearGradient id="rwBladeSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- CPU Metric Gradient (Emerald to Cyan) -->
    <linearGradient id="rwMeterCpu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- RAM Metric Gradient (Blue to Indigo) -->
    <linearGradient id="rwMeterRam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Alert / Storage Gradient (Amber to Red) -->
    <linearGradient id="rwMeterAlert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="rwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Soft Glow -->
    <filter id="rwSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="256" height="256" rx="56" fill="url(#rwBgGrad)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="55" stroke="url(#rwSquircleBorder)" stroke-width="2"/>

  <!-- Outer Glowing Hexagon -->
  <polygon points="128,26 214,75 214,181 128,230 42,181 42,75" 
           fill="#070c1a" stroke="url(#rwHexBorder)" stroke-width="3.5" stroke-linejoin="round"
           filter="url(#rwGlow)"/>
  <polygon points="128,26 214,75 214,181 128,230 42,181 42,75" 
           fill="#070c1a" stroke="url(#rwHexBorder)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hex Inner Wireframe Grid Accent -->
  <polygon points="128,40 200,81 200,175 128,216 56,175 56,81" 
           stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Rack Mount Ear Screws Left & Right -->
  <circle cx="62" cy="80" r="2" fill="#334155"/>
  <circle cx="62" cy="118" r="2" fill="#38bdf8" fill-opacity="0.6"/>
  <circle cx="62" cy="156" r="2" fill="#334155"/>
  <circle cx="194" cy="80" r="2" fill="#334155"/>
  <circle cx="194" cy="118" r="2" fill="#38bdf8" fill-opacity="0.6"/>
  <circle cx="194" cy="156" r="2" fill="#334155"/>

  <!-- Floating Server Blade 1 (CPU & Compute) -->
  <g>
    <rect x="68" y="66" width="120" height="28" rx="6" fill="url(#rwBladeSurface)" stroke="#334155" stroke-width="1.2"/>
    <!-- LED -->
    <circle cx="80" cy="80" r="3" fill="#10b981" filter="url(#rwSoftGlow)"/>
    <circle cx="80" cy="80" r="1.5" fill="#a7f3d0"/>
    <!-- CPU Chip Icon -->
    <rect x="91" y="76" width="9" height="8" rx="1.5" fill="#334155" stroke="#10b981" stroke-width="0.8"/>
    <!-- Metric Gauge Bar -->
    <rect x="106" y="77" width="58" height="6" rx="3" fill="#090d16"/>
    <rect x="106" y="77" width="42" height="6" rx="3" fill="url(#rwMeterCpu)"/>
    <!-- Activity Dots -->
    <circle cx="174" cy="80" r="1.5" fill="#10b981"/>
    <circle cx="179" cy="80" r="1.5" fill="#10b981" fill-opacity="0.6"/>
  </g>

  <!-- Floating Server Blade 2 (RAM & Telemetry - Active Focused) -->
  <g>
    <rect x="68" y="104" width="120" height="28" rx="6" fill="url(#rwBladeSurface)" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.8"/>
    <!-- LED -->
    <circle cx="80" cy="118" r="3" fill="#06b6d4" filter="url(#rwSoftGlow)"/>
    <circle cx="80" cy="118" r="1.5" fill="#cffafe"/>
    <!-- RAM Module Icon -->
    <rect x="91" y="115" width="9" height="6" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
    <!-- Metric Gauge Bar -->
    <rect x="106" y="115" width="58" height="6" rx="3" fill="#090d16"/>
    <rect x="106" y="115" width="36" height="6" rx="3" fill="url(#rwMeterRam)"/>
    <!-- Heartbeat Live Sparkline -->
    <path d="M 169 118 L 172 118 L 174 113 L 176 123 L 178 118 L 181 118" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Floating Server Blade 3 (Storage & System Alerts) -->
  <g>
    <rect x="68" y="142" width="120" height="28" rx="6" fill="url(#rwBladeSurface)" stroke="#334155" stroke-width="1.2"/>
    <!-- LED -->
    <circle cx="80" cy="156" r="3" fill="#f59e0b" filter="url(#rwSoftGlow)"/>
    <circle cx="80" cy="156" r="1.5" fill="#fef3c7"/>
    <!-- Disk Icon -->
    <circle cx="95.5" cy="156" r="4.5" fill="#334155" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="95.5" cy="156" r="1.5" fill="#94a3b8"/>
    <!-- Metric Gauge Bar -->
    <rect x="106" y="153" width="58" height="6" rx="3" fill="#090d16"/>
    <rect x="106" y="153" width="48" height="6" rx="3" fill="url(#rwMeterAlert)"/>
    <!-- Alert Beacon Dot -->
    <circle cx="176" cy="156" r="2.5" fill="#ef4444" filter="url(#rwSoftGlow)"/>
    <circle cx="176" cy="156" r="1" fill="#fee2e2"/>
  </g>

  <!-- Bottom Core Sentinel Beacon -->
  <circle cx="128" cy="193" r="6" fill="#06b6d4" filter="url(#rwGlow)"/>
  <circle cx="128" cy="193" r="2.5" fill="#ffffff"/>
</svg>
