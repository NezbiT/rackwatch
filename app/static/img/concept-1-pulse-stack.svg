<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="65%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Server Blade Gradient -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad1)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" stroke="url(#borderGlow1)" stroke-width="2.5" stroke-opacity="0.75"/>

  <!-- Ambient Internal Glow -->
  <circle cx="128" cy="128" r="70" fill="#06b6d4" fill-opacity="0.08" filter="url(#glow1)"/>

  <!-- Rack Chassis Side Rails -->
  <rect x="38" y="44" width="8" height="168" rx="3" fill="#1e293b"/>
  <rect x="210" y="44" width="8" height="168" rx="3" fill="#1e293b"/>

  <!-- Rack Rail Holes (19 inch rack standard representation) -->
  <circle cx="42" cy="56" r="2" fill="#475569"/>
  <circle cx="42" cy="70" r="2" fill="#475569"/>
  <circle cx="42" cy="100" r="2" fill="#475569"/>
  <circle cx="42" cy="128" r="2" fill="#475569"/>
  <circle cx="42" cy="156" r="2" fill="#475569"/>
  <circle cx="42" cy="186" r="2" fill="#475569"/>
  <circle cx="42" cy="200" r="2" fill="#475569"/>

  <circle cx="214" cy="56" r="2" fill="#475569"/>
  <circle cx="214" cy="70" r="2" fill="#475569"/>
  <circle cx="214" cy="100" r="2" fill="#475569"/>
  <circle cx="214" cy="128" r="2" fill="#475569"/>
  <circle cx="214" cy="156" r="2" fill="#475569"/>
  <circle cx="214" cy="186" r="2" fill="#475569"/>
  <circle cx="214" cy="200" r="2" fill="#475569"/>

  <!-- Blade 1 (Top 1U Unit) -->
  <g>
    <rect x="52" y="52" width="152" height="34" rx="8" fill="url(#bladeGrad1)" stroke="#334155" stroke-width="1.2"/>
    <!-- Drive Bays -->
    <rect x="62" y="59" width="22" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <rect x="88" y="59" width="22" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <rect x="114" y="59" width="22" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <!-- Ventilation Grille -->
    <line x1="144" y1="63" x2="178" y2="63" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="144" y1="69" x2="178" y2="69" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="144" y1="75" x2="178" y2="75" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Status LEDs -->
    <circle cx="190" cy="69" r="3.5" fill="#10b981" filter="url(#softGlow1)"/>
    <circle cx="190" cy="69" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Blade 2 (Middle 1U Unit with Telemetry Vital Pulse) -->
  <g>
    <rect x="52" y="111" width="152" height="34" rx="8" fill="#070b14" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Neon Pulse Wave Path -->
    <path d="M 54 128 L 92 128 L 102 128 L 112 115 L 122 143 L 134 113 L 144 137 L 152 128 L 202 128" 
          stroke="url(#pulseGrad1)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" 
          fill="none" filter="url(#glow1)"/>
    <path d="M 54 128 L 92 128 L 102 128 L 112 115 L 122 143 L 134 113 L 144 137 L 152 128 L 202 128" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
          fill="none"/>

    <!-- Peak Telemetry Pulse Node -->
    <circle cx="134" cy="113" r="3" fill="#ffffff" filter="url(#softGlow1)"/>
  </g>

  <!-- Blade 3 (Bottom 1U Unit) -->
  <g>
    <rect x="52" y="170" width="152" height="34" rx="8" fill="url(#bladeGrad1)" stroke="#334155" stroke-width="1.2"/>
    <!-- Drive Bays -->
    <rect x="62" y="177" width="22" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <rect x="88" y="177" width="22" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <rect x="114" y="177" width="22" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <!-- Activity Indicators / Mini Bar -->
    <rect x="144" y="181" width="34" height="4" rx="2" fill="#1e293b"/>
    <rect x="144" y="181" width="24" height="4" rx="2" fill="#06b6d4"/>
    <rect x="144" y="189" width="34" height="4" rx="2" fill="#1e293b"/>
    <rect x="144" y="189" width="16" height="4" rx="2" fill="#6366f1"/>
    <!-- Status LED -->
    <circle cx="190" cy="187" r="3.5" fill="#06b6d4" filter="url(#softGlow1)"/>
    <circle cx="190" cy="187" r="1.5" fill="#ffffff"/>
  </g>
</svg>
