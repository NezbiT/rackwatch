# Prometheus scrape config for the RackWatch stack.
# Jobs are named so HostMetrics.instance stays readable on the dashboard.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: rackwatch

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: rackwatch
    metrics_path: /metrics
    static_configs:
      - targets: ["rackwatch:8080"]
        labels:
          instance: rackwatch

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: docker

  # Extra node-exporters on other boxes (Proxmox hosts, VMs). Uncomment and add.
  # - job_name: nodes-extra
  #   static_configs:
  #     - targets: ["192.168.1.20:9100"]
  #       labels:
  #         instance: proxmox
